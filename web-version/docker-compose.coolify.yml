services:
  pot-provider:
    build:
      context: ./bgutil-pot-provider   # <- 아래 Dockerfile을 둘 디렉터리
      dockerfile: Dockerfile
    container_name: pot-provider
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TOKEN_TTL=21600        # 토큰 캐시 TTL(초). 필요 시 조정
    expose:
      - "8080"                 # 내부 통신만 (외부 포트 publish 안 함)
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
  ducktracker-server:
    build: .
    container_name: ducktracker-web-version
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT="${PORT:-8080}"
      - PORT=${PORT:-8080}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - DOWNLOAD_DIR=${DOWNLOAD_DIR:-/downloads}
      - DOWNLOAD_FORMAT=${DOWNLOAD_FORMAT:-bestvideo+bestaudio/best}
      - DOWNLOAD_QUALITY=${DOWNLOAD_QUALITY:-}
      - OUTPUT_TEMPLATE=${OUTPUT_TEMPLATE:-%(title)s.%(ext)s}
      - YT_DLP_IMAGE=${YT_DLP_IMAGE:-ghcr.io/yt-dlp/yt-dlp:latest}
      - YT_DLP_RUNNER=${YT_DLP_RUNNER:-docker}
      - DOCKER_BIN=${DOCKER_BIN:-docker}
      - SERVER_CONTAINER_NAME=${SERVER_CONTAINER_NAME:-ducktracker-web-version}
      - COOKIE_FILE_PATH=${COOKIE_FILE_PATH}
    expose:
      - "${PORT:-8080}"   # Traefik이 내부 포트로 접근
    volumes:
      - /home/ubuntu/downloads:/downloads # cookies.txt 넣어야함.
      - tracker-db:/data
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  tracker-db: