services:
  ducktracker-server:
    build: .
    container_name: ducktracker-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
    expose:
      - "${PORT:-8080}"   # Traefik이 내부 포트로 접근
    volumes:
      - ${HOST_DOWNLOAD_DIR:-./downloads}:/downloads
      - tracker-db:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  tracker-db: